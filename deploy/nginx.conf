server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # Replace with your domain

    # SSL Configuration (Certbot will update these paths)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem; 
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Application Backend
    set $upstream_app 127.0.0.1:8080;

    location / {
        # Routing logic: Native gRPC (HTTP/2) requests go to grpc_pass
        if ($content_type ~* "application/grpc") {
            error_page 418 = @grpc_backend;
            return 418;
        }

        # Standard HTTP/1.1 requests (REST, Connect JSON/Proto, gRPC-Web)
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Named location for gRPC traffic
    location @grpc_backend {
        grpc_pass grpc://$upstream_app;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
