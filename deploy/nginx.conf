# Email API - Nginx Configuration
# Copy this file to /etc/nginx/sites-available/emailapi
# Then symlink: ln -s /etc/nginx/sites-available/emailapi /etc/nginx/sites-enabled/emailapi

upstream emailapi_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.simpleemailapi.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - handles all traffic
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.simpleemailapi.dev;
    http2 on;

    # SSL certificates - managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.simpleemailapi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.simpleemailapi.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Timeouts for long-running streams
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    grpc_read_timeout 3600s;
    grpc_send_timeout 3600s;

    location / {
        # Route gRPC traffic (native gRPC uses application/grpc content-type)
        if ($content_type ~* "application/grpc") {
            error_page 418 = @grpc_backend;
            return 418;
        }

        # Standard HTTP requests (REST, Connect JSON/Proto, gRPC-Web)
        proxy_pass http://emailapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer settings for large requests
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Named location for native gRPC traffic
    location @grpc_backend {
        grpc_pass grpc://emailapi_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
