# VM Performance Tuning for High-Performance API Workloads
# Applied automatically by setup_vm.sh

#===============================================================================
# BBR Congestion Control (v3 on newer kernels)
#===============================================================================
# Use Fair Queue scheduler (required for BBR)
net.core.default_qdisc = fq

# Enable BBR congestion control (BBRv3 on kernel 6.1+)
net.ipv4.tcp_congestion_control = bbr

#===============================================================================
# TCP Buffer Sizes (optimized for high-throughput)
#===============================================================================
# Maximum receive/send buffer sizes (16MB)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# TCP buffer auto-tuning: min, default, max (bytes)
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

#===============================================================================
# Connection Handling
#===============================================================================
# Max queued connections waiting for accept()
net.core.somaxconn = 65535

# Max packets queued on input when interface receives faster than kernel processes
net.core.netdev_max_backlog = 65536

# Max pending SYN requests (half-open connections)
net.ipv4.tcp_max_syn_backlog = 65535

# Reduce TIME_WAIT duration (default is 60s)
net.ipv4.tcp_fin_timeout = 15

# Reuse TIME_WAIT sockets for new connections (safe with timestamps)
net.ipv4.tcp_tw_reuse = 1

# TCP Fast Open for client and server (3 = both)
net.ipv4.tcp_fastopen = 3

# Expand ephemeral port range for high connection rates
net.ipv4.ip_local_port_range = 1024 65535

#===============================================================================
# Memory Management
#===============================================================================
# Prefer RAM over swap (0-100, lower = prefer RAM)
vm.swappiness = 10

# Max file handles system-wide
fs.file-max = 2097152

#===============================================================================
# Security
#===============================================================================
# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1
