# Email API - Envoy Proxy Configuration
# Production-ready configuration for Connect RPC, gRPC, gRPC-Web, and REST
#
# Installation:
#   1. Copy this file to /etc/envoy/envoy.yaml
#   2. Ensure TLS certificates exist (use certbot)
#   3. sudo systemctl enable envoy && sudo systemctl start envoy
#
# Supports:
#   - Native gRPC (application/grpc) - works with grpcurl
#   - Connect RPC (application/json, application/proto)
#   - gRPC-Web (application/grpc-web)
#   - Long-lived streaming with heartbeat (25s intervals)

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    # ==========================================================================
    # HTTPS Listener (Port 443) - TLS Termination
    # ==========================================================================
    - name: https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_https
                
                # Security: Path normalization
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                
                # Use real client IP
                use_remote_address: true
                
                # HTTP/2 settings for long-lived gRPC streams
                # Heartbeat is 25s, so stream_idle_timeout must be > 25s
                stream_idle_timeout: 0s  # Disable - our app handles heartbeats
                request_timeout: 0s      # Disable for streaming RPCs
                
                common_http_protocol_options:
                  idle_timeout: 3600s    # 1 hour connection idle timeout
                  headers_with_underscores_action: REJECT_REQUEST
                
                http2_protocol_options:
                  max_concurrent_streams: 100
                  initial_stream_window_size: 65536      # 64 KB
                  initial_connection_window_size: 1048576 # 1 MB
                  allow_connect: true
                
                # Route configuration
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: emailapi
                      domains: ["*"]
                      
                      # CORS policy for frontend
                      cors:
                        allow_origin_string_match:
                          - exact: "https://simpleemailapi.dev"
                          - exact: "https://www.simpleemailapi.dev"
                          - exact: "http://localhost:3000"
                        allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                        allow_headers: "Content-Type, Authorization, Accept, X-Webhook-Secret, Connect-Protocol-Version, Connect-Timeout-Ms, Grpc-Timeout, X-Grpc-Web, X-User-Agent"
                        expose_headers: "Content-Length, Content-Type, Grpc-Status, Grpc-Message, Grpc-Status-Details-Bin"
                        max_age: "86400"
                        allow_credentials: true
                      
                      routes:
                        # Health check endpoint (fast path)
                        - match:
                            path: "/health"
                          route:
                            cluster: emailapi_backend
                            timeout: 5s
                        
                        # All other routes - Connect RPC / gRPC / REST
                        - match:
                            prefix: "/"
                          route:
                            cluster: emailapi_backend
                            # Disable timeout for streaming RPCs
                            # Individual RPC timeouts are handled by Connect-Timeout-Ms header
                            timeout: 0s
                            # Retry policy for transient failures (not for streaming)
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,unavailable,cancelled,resource-exhausted"
                              num_retries: 2
                              per_try_timeout: 30s
                
                # HTTP filters
                http_filters:
                  # CORS filter (must be before router)
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  
                  # gRPC-Web filter for browser clients
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  
                  # Router filter (required, must be last)
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          
          # TLS configuration
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # ALPN: prefer HTTP/2, fallback to HTTP/1.1
                alpn_protocols: ["h2", "http/1.1"]
                
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/letsencrypt/live/api.simpleemailapi.dev/fullchain.pem
                    private_key:
                      filename: /etc/letsencrypt/live/api.simpleemailapi.dev/privkey.pem
                
                # TLS parameters (modern secure defaults)
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_3
                  cipher_suites:
                    - ECDHE-ECDSA-AES128-GCM-SHA256
                    - ECDHE-RSA-AES128-GCM-SHA256
                    - ECDHE-ECDSA-AES256-GCM-SHA384
                    - ECDHE-RSA-AES256-GCM-SHA384
                    - ECDHE-ECDSA-CHACHA20-POLY1305
                    - ECDHE-RSA-CHACHA20-POLY1305

    # ==========================================================================
    # HTTP Listener (Port 80) - Redirect to HTTPS
    # ==========================================================================
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                
                route_config:
                  name: redirect_to_https
                  virtual_hosts:
                    - name: redirect
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                            response_code: MOVED_PERMANENTLY
                
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ============================================================================
  # Clusters (Upstream Services)
  # ============================================================================
  clusters:
    - name: emailapi_backend
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      
      # Enable HTTP/2 to backend (h2c - cleartext HTTP/2)
      # This matches your Go server's h2c.NewHandler configuration
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              initial_stream_window_size: 65536
              initial_connection_window_size: 1048576
      
      # Connection pool settings
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000
            max_pending_requests: 1000
            max_requests: 10000
            max_retries: 3
      
      # Health checking
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"
      
      load_assignment:
        cluster_name: emailapi_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8080
