syntax = "proto3";

package emailapi.v1;

option go_package = "github.com/emailapi/api/gen/emailapi/v1";

import "google/api/annotations.proto";
import "google/api/httpbody.proto";

// InternalService handles internal webhook endpoints.
// These endpoints are authenticated via X-Webhook-Secret header.
service InternalService {
  // HandleGuardDutyScanResult processes GuardDuty malware scan results from EventBridge.
  rpc HandleGuardDutyScanResult(GuardDutyScanResultRequest) returns (GuardDutyScanResultResponse) {
    option (google.api.http) = {
      post: "/v1/internal/webhooks/guardduty-scan"
      body: "*"
    };
  }

  // HandleClerkWebhook processes Clerk user lifecycle events (signup, etc.).
  // This endpoint is authenticated via Svix signature verification.
  // We use HttpBody to get the raw payload for verification.
  rpc HandleClerkWebhook(google.api.HttpBody) returns (ClerkWebhookResponse) {
    option (google.api.http) = {
      post: "/v1/internal/webhooks/clerk"
      body: "*"
    };
  }
}

// GuardDutyScanResultRequest contains the scan result from GuardDuty via EventBridge.
message GuardDutyScanResultRequest {
  // S3 bucket where the scanned object resides.
  string s3_bucket = 1;
  // S3 key of the scanned object.
  string s3_key = 2;
  // Scan status: CLEAN, THREATS_FOUND, UNSUPPORTED, FAILED.
  string scan_status = 3;
  // Name of the threat if threats were found.
  string threat_name = 4;
}

// GuardDutyScanResultResponse is the response after processing scan result.
message GuardDutyScanResultResponse {
  // Whether the result was processed successfully.
  bool success = 1;
  // Message describing the action taken.
  string message = 2;
}

// ClerkWebhookRequest is removed as we use HttpBody


// ClerkWebhookResponse is the response after processing Clerk webhook.
message ClerkWebhookResponse {
  // Whether the webhook was processed successfully.
  bool success = 1;
  // Message describing the action taken.
  string message = 2;
}



// InboundEmail represents a parsed inbound email reply.
message InboundEmail {
  // Our generated ID for this inbound email
  string id = 1;
  // The Message-ID header of this email
  string message_id = 2;
  // Message-ID of the original email being replied to
  string in_reply_to = 3;
  // Full References header chain
  repeated string references = 4;
  // Sender email
  string from = 5;
  // Recipients
  repeated string to = 6;
  // Subject
  string subject = 7;
  // Plain text content
  string body = 8;
  // HTML content
  string html = 9;
  // Our internal ID of the original sent email
  string original_email_id = 10;
  // User who sent the original email
  string user_id = 11;
}

