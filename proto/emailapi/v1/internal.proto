syntax = "proto3";

package emailapi.v1;

option go_package = "github.com/emailapi/api/gen/emailapi/v1";

import "google/api/annotations.proto";

// InternalService handles internal webhook endpoints.
// These endpoints are authenticated via X-Webhook-Secret header.
service InternalService {
  // HandleGuardDutyScanResult processes GuardDuty malware scan results from EventBridge.
  rpc HandleGuardDutyScanResult(GuardDutyScanResultRequest) returns (GuardDutyScanResultResponse) {
    option (google.api.http) = {
      post: "/v1/internal/webhooks/guardduty-scan"
      body: "*"
    };
  }

  // HandleSNSNotification processes SNS notifications for inbound emails.
  rpc HandleSNSNotification(SNSNotificationRequest) returns (SNSNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/internal/webhooks/sns"
      body: "*"
    };
  }
}

// GuardDutyScanResultRequest contains the scan result from GuardDuty via EventBridge.
message GuardDutyScanResultRequest {
  // S3 bucket where the scanned object resides.
  string s3_bucket = 1;
  // S3 key of the scanned object.
  string s3_key = 2;
  // Scan status: CLEAN, THREATS_FOUND, UNSUPPORTED, FAILED.
  string scan_status = 3;
  // Name of the threat if threats were found.
  string threat_name = 4;
}

// GuardDutyScanResultResponse is the response after processing scan result.
message GuardDutyScanResultResponse {
  // Whether the result was processed successfully.
  bool success = 1;
  // Message describing the action taken.
  string message = 2;
}

// SNSNotificationRequest is the raw SNS HTTP payload.
// SNS sends different message types - we handle SubscriptionConfirmation and Notification.
message SNSNotificationRequest {
  // Type: SubscriptionConfirmation, Notification, UnsubscribeConfirmation
  string type = 1 [json_name = "Type"];
  // SNS message ID
  string message_id = 2 [json_name = "MessageId"];
  // SNS topic ARN
  string topic_arn = 3 [json_name = "TopicArn"];
  // For Notification: SES notification JSON; For SubscriptionConfirmation: message
  string message = 4 [json_name = "Message"];
  // URL to confirm subscription (only for SubscriptionConfirmation)
  string subscribe_url = 5 [json_name = "SubscribeURL"];
  // When SNS sent this
  string timestamp = 6 [json_name = "Timestamp"];
  // Signature version (1 or 2)
  string signature_version = 7 [json_name = "SignatureVersion"];
  // Base64-encoded signature
  string signature = 8 [json_name = "Signature"];
  // URL to the signing certificate
  string signing_cert_url = 9 [json_name = "SigningCertURL"];
  // Subject (optional, for some Notification types)
  string subject = 10 [json_name = "Subject"];
}

// SNSNotificationResponse is the response after processing SNS notification.
message SNSNotificationResponse {
  // Whether the notification was processed successfully.
  bool success = 1;
  // Message describing the action taken.
  string message = 2;
}

// InboundEmail represents a parsed inbound email reply.
message InboundEmail {
  // Our generated ID for this inbound email
  string id = 1;
  // The Message-ID header of this email
  string message_id = 2;
  // Message-ID of the original email being replied to
  string in_reply_to = 3;
  // Full References header chain
  repeated string references = 4;
  // Sender email
  string from = 5;
  // Recipients
  repeated string to = 6;
  // Subject
  string subject = 7;
  // Plain text content
  string body = 8;
  // HTML content
  string html = 9;
  // Our internal ID of the original sent email
  string original_email_id = 10;
  // User who sent the original email
  string user_id = 11;
}

