syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

import "google/protobuf/timestamp.proto";

// DomainService handles sending domains.
// To send emails with good deliverability, you need to:
// 1. Add a domain (AddDomain)
// 2. Configure the DNS records we give you
// 3. Verify the layout (VerifyDomain)
service DomainService {
  // Register a new domain for sending.
  // Returns the DNS records you need to add to your DNS provider (e.g. Cloudflare, GoDaddy).
  rpc AddDomain(AddDomainRequest) returns (AddDomainResponse) {}

  // Get details for a specific domain, including current DNS status.
  // We automatically refresh the status if it's stale (>5 minutes old).
  rpc GetDomain(GetDomainRequest) returns (GetDomainResponse) {}

  // List all your domains.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {}

  // Remove a domain. You won't be able to send from it anymore.
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse) {}

  // Trigger an immediate check of DNS records.
  // Useful if you just updated your DNS and don't want to wait for the auto-refresh.
  // Rate limited to once every 30 seconds.
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse) {}
}

// DomainStatus tracks the verification lifecycle.
enum DomainStatus {
  DOMAIN_STATUS_UNSPECIFIED = 0;
  // Domain added, waiting for DNS records.
  DOMAIN_STATUS_PENDING = 1;
  // Verification in progress.
  DOMAIN_STATUS_VERIFYING = 2;
  // Verified and ready to send!
  DOMAIN_STATUS_READY = 3;
  // Functional, but some optional records (like custom MAIL FROM) are missing.
  DOMAIN_STATUS_DEGRADED = 4;
  // Verification failed. Check your DNS records.
  DOMAIN_STATUS_FAILED = 5;
}

// Status of a single DNS record.
enum RecordStatus {
  RECORD_STATUS_UNSPECIFIED = 0;
  // We haven't checked this yet.
  RECORD_STATUS_PENDING = 1;
  // Valid and found.
  RECORD_STATUS_FOUND = 2;
  // Found, but the value doesn't match what we expected.
  RECORD_STATUS_MISMATCH = 3;
  // Not found in DNS.
  RECORD_STATUS_MISSING = 4;
}

// Types of DNS records we require.
enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  // DKIM (DomainKeys Identified Mail) - signs your emails.
  RECORD_TYPE_DKIM = 1;
  // SPF (Sender Policy Framework) - authorizes us to send for you.
  RECORD_TYPE_SPF = 2;
  // DMARC - tells receivers what to do with unauthenticated mail.
  RECORD_TYPE_DMARC = 3;
  // MX record for receiving inbound emails (if enabled).
  RECORD_TYPE_MX_INBOUND = 4;
  // MX record for custom MAIL FROM domain (improves deliverability).
  RECORD_TYPE_MAIL_FROM_MX = 5;
  // SPF record for custom MAIL FROM domain.
  RECORD_TYPE_MAIL_FROM_SPF = 6;
}

// A sending domain.
message Domain {
  string id = 1;
  // The domain name (e.g. "example.com").
  string domain = 2;
  // Overall verification status.
  DomainStatus status = 3;
  // AWS Region (e.g. "us-east-1").
  string region = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp last_checked_at = 7;

  // Simple summary of what's needed next.
  DomainSummary summary = 8;
  
  // Detailed DNS records list.
  DomainRecords records = 9;
}

// Human-readable status summary.
message DomainSummary {
  // A friendly message like "Add 3 DNS records to start sending".
  string message = 1;
  
  // Next logical step: "CONFIGURE_DNS", "WAIT" (for receiver cache), or "NONE" (done).
  string next_action = 2;
  
  int32 records_pending = 3;
  int32 records_configured = 4;
  // If true, you can start sending emails (even if not fully optimized).
  bool can_send = 5;
  // If true, you can receive inbound emails.
  bool can_receive = 6;
}

// DNS configuration.
message DomainRecords {
  // DKIM keys (usually CNAMES).
  repeated DnsRecord dkim_records = 1;
  // SPF record (TXT).
  DnsRecord spf_record = 2;
  // DMARC record (TXT).
  DnsRecord dmarc_record = 3;
  // Inbound MX records.
  repeated DnsRecord mx_records = 4;
  // Custom MAIL FROM records.
  repeated DnsRecord mail_from_records = 5;
}

// A single DNS record.
message DnsRecord {
  // Record type: "CNAME", "TXT", or "MX".
  string type = 1;
  
  // Hostname to set (e.g. "email._domainkey").
  string name = 2;
  
  // Value to set (e.g. "k=rsa; ...").
  string value = 3;
  
  // Priority (only for MX records).
  int32 priority = 4;
  
  // What this record is for.
  RecordType record_type = 5;
  
  // Verification status.
  RecordStatus status = 6;
  
  // Shortened hostname (e.g. "email._domainkey" instead of full FQDN) for easier copy-pasting.
  string name_short = 7;
  
  // The value we actually found in your DNS (useful for debugging).
  string discovered_value = 8;
  
  // User-friendly instructions, e.g. "Add this TXT record to verify ownership".
  string instructions = 9;
}

message AddDomainRequest {
  string domain = 1;
}

message AddDomainResponse {
  Domain domain = 1;
  string message = 2;
}

message GetDomainRequest {
  string id = 1;
}

message GetDomainResponse {
  Domain domain = 1;
}

message ListDomainsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListDomainsResponse {
  repeated Domain data = 1;
  int32 total = 2;
}

message DeleteDomainRequest {
  string id = 1;
}

message DeleteDomainResponse {
  string message = 1;
}

message VerifyDomainRequest {
  string id = 1;
}

message VerifyDomainResponse {
  Domain domain = 1;
  // Whether we actually performed a fresh DNS lookup.
  bool was_refreshed = 2;
  // When you can retry if rate limited.
  google.protobuf.Timestamp next_retry_at = 3;
  string message = 4;
}
