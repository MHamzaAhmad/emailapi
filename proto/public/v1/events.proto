syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

import "google/protobuf/timestamp.proto";

// =============================================================================
// Events - Real-time stream of what's happening to your emails.
// =============================================================================
//
// Every time an email changes state (sent, delivered, bounced, reply received),
// an event is generated. You can consume these via:
// 1. Webhooks (push)
// 2. StreamEvents RPC (pull / real-time stream)

// EventType defines the specific kind of event that occurred.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // Email has been accepted by our system and sent to the upstream provider.
  EVENT_TYPE_EMAIL_SENT = 1;
  // Email has been successfully delivered to the recipient's inbox.
  EVENT_TYPE_EMAIL_DELIVERED = 2;
  // Email delivery failed permanently (e.g. invalid address).
  EVENT_TYPE_EMAIL_FAILED = 3;
  // Email bounced (permanent or transient).
  EVENT_TYPE_EMAIL_BOUNCED = 4;
  // Recipient opened the email (requires open tracking).
  EVENT_TYPE_EMAIL_OPENED = 5;
  // Recipient clicked a link in the email (requires click tracking).
  EVENT_TYPE_EMAIL_CLICKED = 6;
  // Recipient replied to the email.
  EVENT_TYPE_EMAIL_REPLIED = 7;
  // Recipient marked the email as spam.
  EVENT_TYPE_EMAIL_COMPLAINED = 8;
  // Upstream provider rejected the email.
  EVENT_TYPE_EMAIL_REJECTED = 9;
  // Email delivery is delayed (soft bounce, will retry).
  EVENT_TYPE_EMAIL_DELAYED = 10;
  // Internal heartbeat to keep connections alive. safely ignore.
  EVENT_TYPE_HEARTBEAT = 99;
}

// Event is the wrapper for all event payloads.
message Event {
  // Unique event ID. Use this as a cursor to resume streaming.
  string id = 1;
  
  // The type of event.
  EventType type = 2;
  
  // When the event occurred.
  google.protobuf.Timestamp timestamp = 3;
  
  // The actual event data.
  oneof payload {
    EmailSentEvent email_sent = 10;
    EmailDeliveredEvent email_delivered = 11;
    EmailBouncedEvent email_bounced = 12;
    EmailComplainedEvent email_complained = 13;
    EmailRejectedEvent email_rejected = 14;
    EmailDelayedEvent email_delayed = 15;
    EmailRepliedEvent email_replied = 16;
    EmailFailedEvent email_failed = 17;
  }
}

// =============================================================================
// Event Payloads
// =============================================================================

// Email was accepted and sent to the upstream provider.
message EmailSentEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  string from = 4;
  repeated string to = 5;
  repeated string cc = 6;
  repeated string bcc = 7;
  string subject = 8;
  map<string, string> metadata = 9;
}

// Email reached the recipient's mail server.
message EmailDeliveredEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  repeated string recipients = 4;
  // Detailed response from the SMTP server.
  string smtp_response = 5;
}

// Email bounced.
message EmailBouncedEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  // "Permanent" or "Transient"
  string bounce_type = 4;
  // More specific reason (e.g. "MailboxFull", "General")
  string bounce_subtype = 5;
  repeated string recipients = 6;
  // Technical error codes.
  repeated string diagnostic_codes = 7;
}

// Recipient marked as spam.
message EmailComplainedEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  // e.g. "abuse", "fraud"
  string feedback_type = 4;
  repeated string recipients = 5;
}

// Upstream rejected the request.
message EmailRejectedEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  string reason = 4;
}

// Delivery is delayed but will be retried.
message EmailDelayedEvent {
  string email_id = 1;
  string user_id = 2;
  string message_id = 3;
  string delay_type = 4;
}

// Sending failed permanently.
message EmailFailedEvent {
  string email_id = 1;
  string user_id = 2;
  string error = 3;
}

// Inbound reply received.
message EmailRepliedEvent {
  // ID of this new inbound email.
  string id = 1;
  string user_id = 2;
  // Message-ID from the email headers.
  string message_id = 3;
  // Message-ID of the email that was replied to.
  string in_reply_to = 4;
  // Thread reference chain.
  repeated string references = 5;
  // Who sent the reply.
  string from = 6;
  // Who received the reply (your address).
  repeated string to = 7;
  string subject = 8;
  // Reply content (plain text).
  string body = 9;
  // Reply content (HTML).
  string html = 10;
  // ID of the original email that was replied to (if found).
  string parent_email_id = 11;
}
