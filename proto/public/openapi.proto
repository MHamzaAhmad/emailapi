syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

import "gnostic/openapi/v3/annotations.proto";

// Document-level OpenAPI configuration for MsgMorph API.
// This file provides metadata for the generated OpenAPI spec used by Mintlify.
option (gnostic.openapi.v3.document) = {
  info: {
    title: "SimpleEmailAPI";
    version: "1.0.0";
    description: "The SimpleEmailAPI is a type-safe email API for sending transactional emails with real-time event streaming. Built on Connect RPC for maximum type safety and developer experience.";
    contact: {
      name: "SimpleEmailAPI Support";
      url: "https://simpleemailapi.dev";
      email: "support@simpleemailapi.dev";
    }
  }
  servers: [
    {
      url: "https://api.simpleemailapi.dev";
      description: "Production";
    }
  ]
  components: {
    security_schemes: {
      additional_properties: [
        {
          name: "BearerAuth";
          value: {
            security_scheme: {
              type: "http";
              scheme: "bearer";
              description: "API key authentication. Get your API key from the SimpleEmailAPI dashboard and include it in the Authorization header as: Bearer sea_live_xxxxx";
            }
          }
        }
      ]
    }
  }
  security: [
    {
      additional_properties: [
        {
          name: "BearerAuth";
          value: {
            value: []
          }
        }
      ]
    }
  ]
};
