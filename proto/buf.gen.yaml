version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      module: buf.build/emailapi/api
      value: github.com/emailapi/api/gen

plugins:
  # Go protobuf messages for API server
  - remote: buf.build/protocolbuffers/go
    out: ../apps/api/gen
    opt: paths=source_relative

  # Go gRPC service stubs for API server
  - remote: buf.build/grpc/go
    out: ../apps/api/gen
    opt: paths=source_relative

  # gRPC-Gateway (HTTP/REST proxy) for API server
  - remote: buf.build/grpc-ecosystem/gateway
    out: ../apps/api/gen
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
