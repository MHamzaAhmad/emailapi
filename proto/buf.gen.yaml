version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      module: buf.build/emailapi/public
      value: github.com/emailapi/api/gen
    - file_option: go_package_prefix
      module: buf.build/emailapi/private
      value: github.com/emailapi/api/gen

plugins:
  # Go protobuf messages for API server
  - remote: buf.build/protocolbuffers/go
    out: ../apps/api/gen
    opt: paths=source_relative

  # Connect RPC handlers and clients for API server
  - remote: buf.build/connectrpc/go
    out: ../apps/api/gen
    opt: paths=source_relative

  # TypeScript protobuf messages for web app (Connect v2)
  - remote: buf.build/bufbuild/es:v2.2.3
    out: ../apps/web/src/generated
    opt:
      - target=ts
      - import_extension=none
    include_imports: true
