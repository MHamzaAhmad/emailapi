version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      module: buf.build/emailapi/api
      value: github.com/emailapi/sdk-go/gen
plugins:
  # Go protobuf messages for SDK
  - remote: buf.build/protocolbuffers/go
    out: ../packages/sdk-go/gen
    opt: paths=source_relative

  # Go Connect client for SDK  
  - remote: buf.build/connectrpc/go
    out: ../packages/sdk-go/gen
    opt: paths=source_relative

  # TypeScript protobuf messages only (Connect v2 doesn't need separate generator)
  - remote: buf.build/bufbuild/es:v2.2.3
    out: ../packages/sdk-ts/src/generated
    opt:
      - target=ts
      - import_extension=none
    include_imports: true
