syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

// SnsService handles notifications from Amazon SNS.
// These endpoints are public but authenticated via SNS signature verification.
service SnsService {
  // HandleSNSNotification processes SNS notifications for outbound email events.
  // (Delivery, Bounce, Complaint, Send, Reject, DeliveryDelay)
  rpc HandleSNSNotification(SNSNotificationRequest) returns (SNSNotificationResponse) {}

  // HandleInboundSNSNotification processes SNS notifications for inbound emails (replies).
  // This endpoint receives SES inbound email notifications when replies are received.
  rpc HandleInboundSNSNotification(SNSNotificationRequest) returns (SNSNotificationResponse) {}
}

// SNSNotificationRequest is the raw SNS HTTP payload.
message SNSNotificationRequest {
  // Type: SubscriptionConfirmation, Notification, UnsubscribeConfirmation
  string type = 1 [json_name = "Type"];
  // SNS message ID
  string message_id = 2 [json_name = "MessageId"];
  // SNS topic ARN
  string topic_arn = 3 [json_name = "TopicArn"];
  // For Notification: SES notification JSON; For SubscriptionConfirmation: message
  string message = 4 [json_name = "Message"];
  // URL to confirm subscription (only for SubscriptionConfirmation)
  string subscribe_url = 5 [json_name = "SubscribeURL"];
  // When SNS sent this
  string timestamp = 6 [json_name = "Timestamp"];
  // Signature version (1 or 2)
  string signature_version = 7 [json_name = "SignatureVersion"];
  // Base64-encoded signature
  string signature = 8 [json_name = "Signature"];
  // URL to the signing certificate
  string signing_cert_url = 9 [json_name = "SigningCertURL"];
  // Subject (optional, for some Notification types)
  string subject = 10 [json_name = "Subject"];
  // Token (required for SubscriptionConfirmation/UnsubscribeConfirmation)
  string token = 11 [json_name = "Token"];
}

// SNSNotificationResponse is the response after processing SNS notification.
message SNSNotificationResponse {
  // Whether the notification was processed successfully.
  bool success = 1;
  // Message describing the action taken.
  string message = 2;
}
