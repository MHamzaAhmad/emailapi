syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

import "google/protobuf/timestamp.proto";

// ActivityService provides access to activity logs.
service ActivityService {
  // ListActivityLogs retrieves activity logs with pagination and optional filters.
  rpc ListActivityLogs(ListActivityLogsRequest) returns (ListActivityLogsResponse) {}
}

// ActivityLog represents a single activity log entry.
message ActivityLog {
  string id = 1;
  string user_id = 2;
  string entity_type = 3;  // email, domain, api_key, webhook
  string entity_id = 4;
  string action = 5;       // sent, delivered, bounced, created, deleted, etc.
  string status = 6;       // success, failed, pending
  string details = 7;      // Human readable message
  string metadata = 8;     // JSON payload
  google.protobuf.Timestamp timestamp = 9;
}

// ListActivityLogsRequest defines parameters for listing activity logs.
message ListActivityLogsRequest {
  // Pagination
  int32 page_size = 1;    // Max number of logs to return (default: 20, max: 100)
  int32 offset = 2;       // Number of logs to skip

  // Optional filters
  optional string entity_type = 3;  // Filter by entity type
  optional string action = 4;       // Filter by action
  optional int64 start_time = 5;    // Filter by start time (Unix ms)
  optional int64 end_time = 6;      // Filter by end time (Unix ms)
}

// ListActivityLogsResponse contains the list of activity logs.
message ListActivityLogsResponse {
  repeated ActivityLog logs = 1;
  int32 total_count = 2;
}
