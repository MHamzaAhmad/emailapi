syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

import "google/protobuf/timestamp.proto";

// UserService handles user operations.
service UserService {
  // CreateUser creates a new user.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}

  // GetCurrentUser retrieves the authenticated user.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (User) {}

  // UpdateUser updates a user.
  rpc UpdateUser(UpdateUserRequest) returns (User) {}

  // ListUsers lists all users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_MEMBER = 2;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  UserRole role = 3;
  optional string external_id = 4; // Clerk user ID (set via webhook)
}

message CreateUserResponse {
  User user = 1;
  string message = 2;
}

message GetCurrentUserRequest {}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  UserRole role = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional string external_id = 8; // Clerk user ID
}

message UpdateUserRequest {
  string id = 1;
  optional string email = 2;
  optional string name = 3;
  optional UserRole role = 4;
  optional bool is_active = 5;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2; // Not used yet based on internal service, but standard proto practice
  int32 offset = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
  string next_page_token = 3;
}
