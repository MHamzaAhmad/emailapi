syntax = "proto3";

package v1;

option go_package = "github.com/emailapi/api/gen/v1";

service BillingService {
  // SyncSubscription checks Polar for latest subscription and updates user.
  rpc SyncSubscription(SyncSubscriptionRequest) returns (SyncSubscriptionResponse) {}
  
  // GetPlans returns available pricing plans.
  rpc GetPlans(GetPlansRequest) returns (GetPlansResponse) {}
  
  // CreateCheckoutSession generates a Polar checkout URL for plan upgrade.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {}
  
  // GetCustomerPortalUrl returns URL for subscription management.
  rpc GetCustomerPortalUrl(GetCustomerPortalUrlRequest) returns (GetCustomerPortalUrlResponse) {}
}

// Plan represents a pricing tier.
message Plan {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 monthly_limit = 4;  // -1 = unlimited
  int64 daily_limit = 5;    // -1 = unlimited
  int64 price_cents = 6;    // Monthly price in cents
}

message SyncSubscriptionRequest {}
message SyncSubscriptionResponse {
  string user_id = 1;
  string plan = 2;
  string polar_customer_id = 3;
}

message GetPlansRequest {}
message GetPlansResponse {
  repeated Plan plans = 1;
}

message CreateCheckoutSessionRequest {
  string plan_id = 1;
  string success_url = 2;
}
message CreateCheckoutSessionResponse {
  string checkout_url = 1;
}

message GetCustomerPortalUrlRequest {}
message GetCustomerPortalUrlResponse {
  string portal_url = 1;
}
