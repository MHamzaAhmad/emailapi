default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 0.39.3
        output:
          location: local-file-system
          path: ../packages/sdk-ts/src/generated
        config:
          namespaceExport: EmailApi
          
      - name: fernapi/fern-go-sdk
        version: 0.19.0
        output:
          location: local-file-system
          path: ../packages/sdk-go/generated
        config:
          packageName: emailapi
          module:
            path: github.com/emailapi/sdk-go/generated

  docs:
    generators:
      - name: fernapi/fern-docs
        version: 0.0.0
        output:
          location: local-file-system
          path: ../docs

api:
  path: api/definition
