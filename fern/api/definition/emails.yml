imports:
  commons: commons.yml

service:
  base-path: ""
  auth: true
  endpoints:
    send:
      docs: Send an email
      method: POST
      path: /send
      request: SendEmailRequest
      response: SendEmailResponse
      errors:
        - commons.BadRequestError
        - commons.UnauthorizedError
        - commons.RateLimitError

    get:
      docs: Get an email by ID
      method: GET
      path: /emails/{id}
      path-parameters:
        id: commons.EmailId
      response: Email
      errors:
        - commons.UnauthorizedError
        - commons.NotFoundError

    list:
      docs: List emails
      method: GET
      path: /emails
      request:
        name: ListEmailsRequest
        query-parameters:
          limit:
            type: optional<integer>
            docs: Maximum number of emails to return (default 20, max 100)
          offset:
            type: optional<integer>
            docs: Number of emails to skip
      response: EmailListResponse

types:
  SendEmailRequest:
    properties:
      from:
        type: string
        docs: Sender email address
      to:
        type: list<string>
        docs: Recipient email addresses
      cc:
        type: optional<list<string>>
      bcc:
        type: optional<list<string>>
      subject:
        type: string
        docs: Email subject line
      body:
        type: optional<string>
        docs: Plain text body
      html:
        type: optional<string>
        docs: HTML body
      metadata:
        type: optional<map<string, unknown>>
      scheduled_at:
        type: optional<datetime>

  SendEmailResponse:
    properties:
      id: commons.EmailId
      status: commons.EmailStatus

  Email:
    properties:
      id: commons.EmailId
      from: string
      to: list<string>
      cc: optional<list<string>>
      bcc: optional<list<string>>
      subject: string
      body: optional<string>
      html: optional<string>
      status: commons.EmailStatus
      provider_id: optional<string>
      user_id: commons.UserId
      metadata: optional<map<string, unknown>>
      scheduled_at: optional<datetime>
      sent_at: optional<datetime>
      created_at: datetime
      updated_at: datetime

  EmailListResponse:
    properties:
      data: list<Email>
      limit: integer
      offset: integer
