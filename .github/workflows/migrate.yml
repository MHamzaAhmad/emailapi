name: Apply schema migrations

on:
  push:
    branches:
      - main
    paths:
      - 'db/postgres/migrations/**'
  workflow_dispatch:

jobs:
  apply_migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Install River CLI
        run: go install github.com/riverqueue/river/cmd/river@latest

      - name: Apply Goose migrations
        run: |
          # Use simple protocol to avoid prepared statements with Neon's PgBouncer
          if [[ "$DATABASE_URL" == *"?"* ]]; then
            MIGRATION_URL="${DATABASE_URL}&prefer_simple_protocol=true"
          else
            MIGRATION_URL="${DATABASE_URL}?prefer_simple_protocol=true"
          fi
          goose -dir db/postgres/migrations postgres "$MIGRATION_URL" up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply River migrations
        run: river migrate-up --database-url "$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}