services:
  postgres:
    image: postgres:18-alpine
    container_name: emailapi-postgres
    environment:
      POSTGRES_USER: emailapi
      POSTGRES_PASSWORD: emailapi
      POSTGRES_DB: emailapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: emailapi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@emailapi.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: emailapi-clickhouse
    environment:
      CLICKHOUSE_DB: emailapi
      CLICKHOUSE_USER: emailapi
      CLICKHOUSE_PASSWORD: emailapi
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tabix:
    image: spoonest/clickhouse-tabix-web-client:stable
    container_name: emailapi-tabix
    ports:
      - "8124:80"
    depends_on:
      - clickhouse
    environment:
      CH_HOST: clickhouse
      CH_PORT: 8123

  redis:
    image: redis:7-alpine
    container_name: emailapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  pgadmin_data:
  clickhouse_data:
  redis_data:

networks:
  default:
    name: emailapi-network
