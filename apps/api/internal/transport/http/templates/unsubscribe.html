<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .email {
            font-weight: 600;
            color: #333;
            background: #f5f5f5;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #e74c3c;
            color: white;
        }

        .btn-primary:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            margin-left: 8px;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
        }

        .actions {
            margin-top: 24px;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📧</div>
        <h1>Unsubscribe from emails</h1>
        <p>
            You are about to unsubscribe<br>
            <span class="email">{{.Email}}</span><br>
            from this sender's email list.
        </p>
        <form method="POST" action="/unsubscribe">
            <input type="hidden" name="token" value="{{.Token}}">
            <div class="actions">
                <button type="submit" class="btn btn-primary">Unsubscribe</button>
            </div>
        </form>
        <div class="footer">
            This request was initiated by clicking an unsubscribe link in an email.
        </div>
    </div>
</body>

</html>
