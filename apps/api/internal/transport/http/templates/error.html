<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .error-msg {
            background: #fff5f5;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">⚠️</div>
        <h1>Something went wrong</h1>
        <p class="error-msg">{{.Error}}</p>
        <div class="footer">
            Please try clicking the unsubscribe link again, or contact the sender directly.
        </div>
    </div>
</body>

</html>
